<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gerenciador de tarefas simples, em um único arquivo HTML, com persistência no navegador.">
    <title>Gerenciador de Tarefas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2328a745'/%3E%3Cpath d='M9 16.5l5 5 9-10' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            padding: 2rem;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 { text-align: center; color: #333; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
        }
        input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button#add-btn {
            padding: 8px 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #eee;
            gap: 10px;
        }
        li span { overflow-wrap: anywhere; }
        li.completed span {
            text-decoration: line-through;
            color: #888;
        }
        .actions { display: flex; gap: 5px; }
        .btn-del { background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 4px 8px; }
        .btn-done { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 4px 8px; }
        .btn-restore { background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 4px 8px; }
        :focus-visible { outline: 2px solid #0b5ed7; outline-offset: 2px; }
        #counter {
            margin: 0 0 0.5rem;
            text-align: right;
            color: #666;
            font-size: 0.85rem;
        }
        #empty-state {
            text-align: center;
            color: #888;
            margin: 1rem 0 0;
            font-size: 0.9rem;
        }
        #storage-warning {
            margin: 1rem 0 0;
            padding: 8px 10px;
            border: 1px solid #d9a400;
            background: #fff8e1;
            border-radius: 4px;
            color: #6b5300;
            font-size: 0.85rem;
        }
        #trash {
            margin-top: 1.5rem;
            padding-top: 0.75rem;
            border-top: 1px solid #eee;
        }
        .trash-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
        }
        .trash-header h2 {
            margin: 0;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #888;
        }
        #clear-trash {
            background: none;
            border: none;
            padding: 2px 4px;
            color: #b02a37;
            font-size: 0.8rem;
            cursor: pointer;
        }
        #clear-trash:hover { text-decoration: underline; }
        #trash-list li {
            border-bottom: none;
            padding: 4px 8px;
            font-size: 0.9rem;
            color: #999;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Minhas Tarefas</h1>
        <div class="input-group">
            <label class="sr-only" for="task-input">Nova tarefa</label>
            <input type="text" id="task-input" placeholder="Nova tarefa..." autocomplete="off">
            <button id="add-btn" type="button">Adicionar</button>
        </div>
        <p id="counter" role="status" hidden></p>
        <ul id="task-list"></ul>
        <p id="empty-state">Nenhuma tarefa ainda. Adicione a primeira acima.</p>
        <p id="storage-warning" role="status" hidden></p>

        <section id="trash" hidden>
            <div class="trash-header">
                <h2>Removidas recentemente</h2>
                <button id="clear-trash" type="button">Limpar</button>
            </div>
            <ul id="trash-list"></ul>
        </section>
    </div>

    <script>
        const input = document.getElementById('task-input');
        const addBtn = document.getElementById('add-btn');
        const list = document.getElementById('task-list');
        const counter = document.getElementById('counter');
        const emptyState = document.getElementById('empty-state');
        const storageWarning = document.getElementById('storage-warning');
        const trashSection = document.getElementById('trash');
        const trashList = document.getElementById('trash-list');
        const clearTrashBtn = document.getElementById('clear-trash');

        const STORAGE_KEY = 'tasks';
        const TRASH_KEY = 'tasks-trash';
        // A lixeira é uma rede de segurança para o clique errado, não um
        // histórico: guarda apenas as remoções mais recentes.
        const TRASH_LIMIT = 10;

        function showStorageWarning() {
            if (!storageWarning.hidden) return;
            storageWarning.textContent = 'Não foi possível salvar no navegador: '
                + 'as alterações desta sessão serão perdidas ao fechar a página.';
            storageWarning.hidden = false;
        }

        // O rótulo acompanha o estado: uma vez concluída, o botão reabre a tarefa.
        function setDoneState(btn, text, isDone) {
            btn.setAttribute('aria-pressed', String(isDone));
            btn.setAttribute('aria-label', `${isDone ? 'Reabrir' : 'Concluir'} "${text}"`);
        }

        function refreshUI() {
            const total = list.children.length;
            const pending = list.querySelectorAll('li:not(.completed)').length;

            emptyState.hidden = total > 0;
            counter.hidden = total === 0;
            counter.textContent = pending === 0
                ? 'Tudo concluído'
                : `${pending} de ${total} pendente${pending > 1 ? 's' : ''}`;

            trashSection.hidden = trashList.children.length === 0;
        }

        function serialize(ul) {
            return Array.from(ul.querySelectorAll('li'), li => ({
                text: li.querySelector('span').textContent,
                completed: li.classList.contains('completed')
            }));
        }

        function saveTasks() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(serialize(list)));
                localStorage.setItem(TRASH_KEY, JSON.stringify(serialize(trashList)));
            } catch (err) {
                // Armazenamento bloqueado ou cota estourada: a lista segue
                // utilizável na sessão, mas nada é persistido — avisar em vez
                // de deixar o usuário confiar num save que não aconteceu.
                console.warn('Não foi possível salvar as tarefas:', err);
                showStorageWarning();
            }
        }

        function readStored(key) {
            let data = [];
            try {
                data = JSON.parse(localStorage.getItem(key) || '[]');
            } catch (err) {
                // Dados corrompidos não podem travar a inicialização.
                console.warn(`Dados salvos inválidos em "${key}", começando do zero:`, err);
            }
            return Array.isArray(data) ? data : [];
        }

        function loadTasks() {
            readStored(STORAGE_KEY).forEach(t => addTask(t && t.text, t && t.completed));
            readStored(TRASH_KEY).forEach(t => addTrashItem(t && t.text, t && t.completed));
            refreshUI();
        }

        function addTask(text, completed = false) {
            text = String(text == null ? '' : text).trim();
            if (!text) return;

            const li = document.createElement('li');
            if (completed) li.classList.add('completed');

            const span = document.createElement('span');
            span.textContent = text;

            const doneBtn = document.createElement('button');
            doneBtn.type = 'button';
            doneBtn.className = 'btn-done';
            doneBtn.textContent = '✓';
            setDoneState(doneBtn, text, Boolean(completed));
            doneBtn.onclick = () => {
                const isDone = li.classList.toggle('completed');
                setDoneState(doneBtn, text, isDone);
                refreshUI();
                saveTasks();
            };

            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'btn-del';
            delBtn.textContent = '✕';
            delBtn.setAttribute('aria-label', `Remover "${text}"`);
            delBtn.onclick = () => {
                // Remover não descarta: a tarefa cai na lixeira, de onde pode
                // voltar com o estado de concluída que tinha.
                li.remove();
                addTrashItem(text, li.classList.contains('completed'), true);
                refreshUI();
                saveTasks();
            };

            const actions = document.createElement('div');
            actions.className = 'actions';
            actions.append(doneBtn, delBtn);

            li.append(span, actions);
            list.appendChild(li);
        }

        function addTrashItem(text, completed = false, prepend = false) {
            text = String(text == null ? '' : text).trim();
            if (!text) return;

            const li = document.createElement('li');
            if (completed) li.classList.add('completed');

            const span = document.createElement('span');
            span.textContent = text;

            const restoreBtn = document.createElement('button');
            restoreBtn.type = 'button';
            restoreBtn.className = 'btn-restore';
            restoreBtn.textContent = '↺';
            restoreBtn.setAttribute('aria-label', `Restaurar "${text}"`);
            restoreBtn.onclick = () => {
                li.remove();
                addTask(text, li.classList.contains('completed'));
                refreshUI();
                saveTasks();
            };

            const actions = document.createElement('div');
            actions.className = 'actions';
            actions.append(restoreBtn);

            li.append(span, actions);

            // Remoção recente entra no topo; o carregamento preserva a ordem salva.
            if (prepend && trashList.firstChild) {
                trashList.insertBefore(li, trashList.firstChild);
            } else {
                trashList.appendChild(li);
            }

            while (trashList.children.length > TRASH_LIMIT) {
                trashList.lastElementChild.remove();
            }
        }

        addBtn.onclick = () => {
            const text = input.value.trim();
            if (!text) {
                input.focus();
                return;
            }
            addTask(text);
            input.value = '';
            input.focus();
            refreshUI();
            saveTasks();
        };

        clearTrashBtn.onclick = () => {
            trashList.innerHTML = '';
            refreshUI();
            saveTasks();
        };

        input.addEventListener('keydown', (e) => {
            // Com IME ativo (japonês, chinês, coreano), o Enter que confirma o
            // candidato não deve adicionar a tarefa ainda em composição.
            if (e.key === 'Enter' && !e.isComposing) addBtn.click();
        });

        // Outra aba gravou: recarrega antes que o próximo save desta aba
        // escreva um DOM desatualizado por cima das alterações de lá.
        // (key === null quando o armazenamento inteiro é limpo.)
        window.addEventListener('storage', (e) => {
            if (e.key !== null && e.key !== STORAGE_KEY && e.key !== TRASH_KEY) return;
            list.innerHTML = '';
            trashList.innerHTML = '';
            loadTasks();
        });

        loadTasks();
    </script>
</body>
</html>
