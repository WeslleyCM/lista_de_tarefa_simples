<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gerenciador de tarefas simples, em um único arquivo HTML, com persistência no navegador.">
    <title>Gerenciador de Tarefas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2328a745'/%3E%3Cpath d='M9 16.5l5 5 9-10' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            padding: 2rem;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 { text-align: center; color: #333; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
        }
        input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button#add-btn {
            padding: 8px 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #eee;
            gap: 10px;
        }
        li span { overflow-wrap: anywhere; }
        li.completed span {
            text-decoration: line-through;
            color: #888;
        }
        .actions { display: flex; gap: 5px; }
        .btn-del { background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 4px 8px; }
        .btn-done { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 4px 8px; }
        :focus-visible { outline: 2px solid #0b5ed7; outline-offset: 2px; }
        #empty-state {
            text-align: center;
            color: #888;
            margin: 1rem 0 0;
            font-size: 0.9rem;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Minhas Tarefas</h1>
        <div class="input-group">
            <label class="sr-only" for="task-input">Nova tarefa</label>
            <input type="text" id="task-input" placeholder="Nova tarefa..." autocomplete="off">
            <button id="add-btn" type="button">Adicionar</button>
        </div>
        <ul id="task-list"></ul>
        <p id="empty-state">Nenhuma tarefa ainda. Adicione a primeira acima.</p>
    </div>

    <script>
        const input = document.getElementById('task-input');
        const addBtn = document.getElementById('add-btn');
        const list = document.getElementById('task-list');
        const emptyState = document.getElementById('empty-state');

        const STORAGE_KEY = 'tasks';

        function updateEmptyState() {
            emptyState.hidden = list.children.length > 0;
        }

        function saveTasks() {
            const tasks = [];
            list.querySelectorAll('li').forEach(li => {
                tasks.push({
                    text: li.querySelector('span').textContent,
                    completed: li.classList.contains('completed')
                });
            });
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            } catch (err) {
                // Modo privado, cota estourada ou armazenamento bloqueado:
                // a lista continua funcionando na sessão atual.
                console.warn('Não foi possível salvar as tarefas:', err);
            }
        }

        function loadTasks() {
            let tasks = [];
            try {
                tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            } catch (err) {
                // Dados corrompidos não podem travar a inicialização.
                console.warn('Dados salvos inválidos, começando do zero:', err);
            }
            if (!Array.isArray(tasks)) tasks = [];
            tasks.forEach(task => addTask(task && task.text, task && task.completed));
            updateEmptyState();
        }

        function addTask(text, completed = false) {
            text = String(text == null ? '' : text).trim();
            if (!text) return;

            const li = document.createElement('li');
            if (completed) li.classList.add('completed');

            const span = document.createElement('span');
            span.textContent = text;

            const doneBtn = document.createElement('button');
            doneBtn.type = 'button';
            doneBtn.className = 'btn-done';
            doneBtn.textContent = '✓';
            doneBtn.setAttribute('aria-label', `Concluir "${text}"`);
            doneBtn.setAttribute('aria-pressed', String(Boolean(completed)));
            doneBtn.onclick = () => {
                const isDone = li.classList.toggle('completed');
                doneBtn.setAttribute('aria-pressed', String(isDone));
                saveTasks();
            };

            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'btn-del';
            delBtn.textContent = '✕';
            delBtn.setAttribute('aria-label', `Remover "${text}"`);
            delBtn.onclick = () => {
                li.remove();
                updateEmptyState();
                saveTasks();
            };

            const actions = document.createElement('div');
            actions.className = 'actions';
            actions.append(doneBtn, delBtn);

            li.append(span, actions);
            list.appendChild(li);
        }

        addBtn.onclick = () => {
            const text = input.value.trim();
            if (!text) {
                input.focus();
                return;
            }
            addTask(text);
            input.value = '';
            input.focus();
            updateEmptyState();
            saveTasks();
        };

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') addBtn.click();
        });

        loadTasks();
    </script>
</body>
</html>
